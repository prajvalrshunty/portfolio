<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E12" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="1160" height="660" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Browser mockup header -->
  <rect x="20" y="20" width="1160" height="50" rx="16" fill="#141418" />
  <circle cx="60" cy="45" r="6" fill="#EF4444" />
  <circle cx="85" cy="45" r="6" fill="#F59E0B" />
  <circle cx="110" cy="45" r="6" fill="#10B981" />
  <rect x="180" y="32" width="600" height="26" rx="6" fill="#0A0A0C" stroke="rgba(255,255,255,0.06)" />
  <text x="200" y="49" fill="rgba(255,255,255,0.4)" font-family="'JetBrains Mono', monospace" font-size="12">https://prajvalrshunty.vercel.app</text>

  <!-- Content Representation -->
  <text x="80" y="160" fill="#3B82F6" font-family="'Space Grotesk', sans-serif" font-size="14" letter-spacing="4">FEATURED WORK / DIGITAL IDENTITY</text>
  <text x="80" y="220" fill="#FFFFFF" font-family="'Syne', sans-serif" font-weight="800" font-size="44">TURNING DATA INTO INTELLIGENCE.</text>
  <text x="80" y="270" fill="rgba(255,255,255,0.7)" font-family="'Syne', sans-serif" font-weight="800" font-size="44">TURNING IDEAS INTO REALITY.</text>

  <!-- Interactive Mock Elements -->
  <rect x="80" y="330" width="220" height="48" rx="8" fill="url(#accentGrad)" />
  <text x="120" y="360" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" letter-spacing="1">EXPLORE WORK</text>
  
  <rect x="320" y="330" width="200" height="48" rx="8" fill="transparent" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <text x="350" y="360" fill="#F5F5F7" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" letter-spacing="1">DOWNLOAD CV</text>

  <!-- Graphic Cards in Canvas -->
  <g transform="translate(680, 160)">
    <rect width="440" height="460" rx="12" fill="#121217" stroke="rgba(255,255,255,0.06)" />
    <text x="30" y="45" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="12">LIVE TELEMETRY // STACK</text>
    <rect x="30" y="70" width="380" height="70" rx="8" fill="#181820" />
    <text x="50" y="100" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="16">React 19 + Vite + Tailwind</text>
    <text x="50" y="124" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', sans-serif" font-size="12">Framer Motion animations + Live GitHub API</text>
    
    <rect x="30" y="160" width="380" height="120" rx="8" fill="#181820" />
    <text x="50" y="195" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12">STATUS: PRODUCTION READY</text>
    <text x="50" y="225" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="15">Awwwards-Inspired Editorial Standard</text>
    <text x="50" y="250" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', sans-serif" font-size="12">Asymmetric grid, dark aesthetics &amp; zero fluff</text>

    <!-- Wave graphic -->
    <path d="M 30 380 Q 120 340, 220 370 T 410 350" fill="none" stroke="#3B82F6" stroke-width="2.5" />
    <path d="M 30 400 Q 120 360, 220 390 T 410 370" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>
</svg>
