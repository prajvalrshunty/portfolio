<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <radialGradient id="portraitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="editorialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26262B" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0B0B0E" />
    </linearGradient>
    <linearGradient id="wireframe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="#0A0A0C" />
  <rect width="800" height="1000" fill="url(#portraitGlow)" />

  <!-- Architectural Grid Lines -->
  <line x1="100" y1="0" x2="100" y2="1000" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="700" y1="0" x2="700" y2="1000" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="0" y1="200" x2="800" y2="200" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="0" y1="800" x2="800" y2="800" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Geometric Abstract Silhouette for Developer Portrait -->
  <g transform="translate(400, 480)">
    <!-- Aura circles -->
    <circle r="260" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 6" />
    <circle r="210" stroke="rgba(59,130,246,0.15)" stroke-width="1.5" />
    <circle r="150" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Head / Torso sculptural styling (Black & White Editorial) -->
    <!-- Shoulders -->
    <path d="M-220 380 C-180 260 -90 220 0 220 C90 220 180 260 220 380 Z" fill="url(#editorialGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <!-- Neck -->
    <rect x="-42" y="110" width="84" height="130" rx="10" fill="#18181D" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- Head Base -->
    <path d="M-90 40 C-90 -90 -60 -180 0 -180 C60 -180 90 -90 90 40 C90 120 50 160 0 160 C-50 160 -90 120 -90 40 Z" fill="#1C1C22" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

    <!-- Minimalist Feature Accents -->
    <path d="M-40 -20 C-20 -40 20 -40 40 -20" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Eyeglasses Editorial Frame -->
    <rect x="-65" y="-35" width="50" height="32" rx="6" fill="rgba(10,10,14,0.7)" stroke="#F5F5F7" stroke-width="2" />
    <rect x="15" y="-35" width="50" height="32" rx="6" fill="rgba(10,10,14,0.7)" stroke="#F5F5F7" stroke-width="2" />
    <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#F5F5F7" stroke-width="2" />

    <!-- Geometric Neural Nodes -->
    <circle cx="-160" cy="-120" r="3" fill="#3B82F6" />
    <circle cx="160" cy="-140" r="3" fill="#3B82F6" />
    <circle cx="200" cy="50" r="3" fill="#6366F1" />
    <circle cx="-190" cy="80" r="3" fill="#6366F1" />

    <line x1="-160" y1="-120" x2="-90" y2="-30" stroke="rgba(59,130,246,0.2)" stroke-width="1" />
    <line x1="160" y1="-140" x2="65" y2="-30" stroke="rgba(59,130,246,0.2)" stroke-width="1" />
    <line x1="200" y1="50" x2="90" y2="40" stroke="rgba(99,102,241,0.2)" stroke-width="1" />
  </g>

  <!-- Editorial typography stamps -->
  <text x="70" y="100" fill="#3B82F6" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="4">DEVELOPER PORTRAIT / ARCHIVE 01</text>
  <text x="70" y="125" fill="#FFFFFF" font-family="'Syne', sans-serif" font-weight="700" font-size="28" letter-spacing="1">PRAJVAL R SHUNTY</text>
  <text x="70" y="150" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2">DATA SCIENCE &amp; AI DEVELOPER — BIET DAVANGERE</text>

  <!-- Coordinate stamps -->
  <text x="70" y="930" fill="rgba(255,255,255,0.3)" font-family="'JetBrains Mono', monospace" font-size="11">COORD: 14.4644° N, 75.9218° E // KARNATAKA, INDIA</text>
  <text x="560" y="930" fill="rgba(255,255,255,0.3)" font-family="'JetBrains Mono', monospace" font-size="11">STATUS: 2ND YEAR B.E.</text>

  <!-- Accent border overlay -->
  <rect x="30" y="30" width="740" height="940" rx="12" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
</svg>
