  <text x="795" y="86" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">IDEA / PLANNED</text>

  <!-- Diagram Visual -->
  
      <!-- Matrix grid representation -->
